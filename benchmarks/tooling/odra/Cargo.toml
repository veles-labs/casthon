[package]
name = "tooling_bench"
version = "0.1.0"
edition = "2021"

[dependencies]
odra = "=2.9.1"

[dev-dependencies]
odra-test = "=2.9.1"

[build-dependencies]
odra-build = "=2.9.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = "=2.9.1"

[[bin]]
name = "tooling_bench_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "tooling_bench_build_schema"
path = "bin/build_schema.rs"
test = false

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3

# This fixture lives inside the Casthon checkout but is its own Cargo workspace.
[workspace]
