[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "casthon-sdk"
version = "0.1.0a1"
description = "Python SDK for writing Casper smart contracts with Casthon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typing_extensions>=4.12; python_version<'3.12'"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/veles-labs/casthon"
Issues = "https://github.com/veles-labs/casthon/issues"

[project.optional-dependencies]
dev = ["mypy==1.19.1", "wasmtime==49.0.0", "pytest==9.1.1"]

[tool.casthon]
micropython = "1.29.0"
targets = ["contracts/counter.py"]

[tool.pytest.ini_options]
testpaths = ["tests/test_*.py"]
pythonpath = ["src", "tests", "tests/wasm", "tests/fixtures"]
addopts = ["--import-mode=importlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["contracts", "src/casthon"]
