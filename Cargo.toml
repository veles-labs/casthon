[package]
name = "casthon"
version = "0.1.0"
edition = "2024"
description = "Build Python smart contracts for Casper"
publish = false

[[bin]]
name = "casthon"
path = "cli/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
wasm-softfloat = { version = "0.1.0", path = "tools/wasm-softfloat" }

[dev-dependencies]
tempfile = "3.27.0"
