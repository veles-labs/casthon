[package]
name = "casthon"
version = "0.1.0"
edition = "2024"
description = "Build Python smart contracts for Casper"
license = "Apache-2.0"
repository = "https://github.com/veles-labs/casthon"
homepage = "https://veles-labs.github.io/casthon/"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/cli/**",
    "/contracts/**",
    "/native/**",
    "/reference/cep18/**",
    "/runtime/**",
    "/scripts/**",
    "/src/casthon/**",
    "/templates/flipper/**",
    "/tests/cli.rs",
    "/tests/doctor.rs",
    "!**/__pycache__/**",
    "!**/.mypy_cache/**",
    "!**/.pytest_cache/**",
    "!**/.DS_Store",
]

[lib]
name = "wasm_softfloat"
path = "cli/wasm_softfloat.rs"

[[bin]]
name = "casthon"
path = "cli/main.rs"

[dependencies]
anyhow = "1.0.104"
casper-wasm = "1.0.0"
casper-wasm-utils = "4.0.0"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
include_dir = "0.7.4"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
wasm-encoder = { version = "0.261.0", features = ["wasmparser"] }
wasmparser = "0.261.0"

[dev-dependencies]
tempfile = "3.27.0"
